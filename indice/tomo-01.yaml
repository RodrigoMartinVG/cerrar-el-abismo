# Tomo I — Fundamentos: lógica, números y estructuras
# Fuente del índice (decisión 0002): la especificación se escribe desde aquí.
id: I
titulo: 'Fundamentos: lógica, números y estructuras'
requiere: []
interfaces: []
presentacion: El lenguaje de la matemática, los sistemas numéricos y las estructuras algebraicas y discretas que usan todos los tomos, incluida la forma en que una computadora representa los números.
partes:
  - letra: A
    titulo: Lenguaje y números
    capitulos:
      - id: I.1
        titulo: Lógica y demostración
        paginas: 40
        requiere: []
        tipo: nucleo
        contenidos:
          - 'Lógica proposicional: conectivos, tablas de verdad, equivalencias, implicación, contrapositiva y negación.'
          - Cuantificadores, su negación y su orden.
          - 'Técnicas de demostración: directa, por contradicción, por casos y por contraejemplo; inducción simple y fuerte.'
          - Notación de sumatorias y productorias; manipulación de índices.
        puente: 'Entrada: la regularidad 1 + 3 + ⋯ + (2n − 1) = n², y la misma afirmación dentro de un bucle, como `assert i <= n and s == i * i`. Un invariante de bucle es un enunciado que se demuestra por inducción; una aserción es una implicación que el programa comprueba al ejecutarse.'
        aplicaciones:
          - campo: cripto
            texto: 'la exponenciación rápida de RSA: su invariante, demostrado por inducción, y el ataque por tiempos que la demostración no cubre'
          - campo: datos
            texto: 'pruebas basadas en propiedades: un contraejemplo refuta y cien casos no demuestran; el *shrinking* reduce el contraejemplo'
          - campo: 3d
            texto: 'la precondición de `normalize` como hipótesis de una implicación, y por qué con números de máquina pasa a ser ε < |v|'
        lecturas:
          rigor: 'Velleman, *How to Prove It*; Hammack, *Book of Proof*.'
          practica: 'Floyd, «Assigning Meanings to Programs» (1967), y Hoare, «An Axiomatic Basis for Computer Programming» (1969), el origen de los invariantes; Claessen y Hughes, «QuickCheck» (2000), sobre las pruebas basadas en propiedades.'
          primer_contacto: 'Solow, *How to Read and Do Proofs*; Pólya, *Cómo plantear y resolver problemas*.'
          espanol: 'Gentile, *Notas de álgebra I*; Krick, *Álgebra I*.'
      - id: I.2
        titulo: Conjuntos, relaciones y funciones
        paginas: 44
        requiere:
          - I.1
        tipo: nucleo
        contenidos:
          - Conjuntos, operaciones, producto cartesiano y conjunto de partes.
          - Relaciones de equivalencia, clases y particiones; relaciones de orden.
          - Funciones inyectivas, sobreyectivas y biyectivas; composición, inversa, imagen y preimagen.
          - 'Cardinalidad: conjuntos finitos, numerables y no numerables; argumento diagonal de Cantor. Los cardinales infinitos en general llegan en I.11.'
        puente: 'Entrada: `Map<Key, Value>` y una función `hash(key)`. Un diccionario es una función parcial, y una función de dispersión no puede ser inyectiva cuando el dominio es más grande que el codominio.'
        aplicaciones:
          - campo: cripto
            texto: 'los choques de SHA-256: el palomar dice que existen, no cómo encontrarlos'
          - campo: cripto
            texto: 'tablas de dispersión bajo ataque: choques fabricados por composición, y la defensa con un orden total'
          - campo: datos
            texto: 'el modelo relacional: tablas como funciones, JOIN como composición y GROUP BY como cociente bien definido'
          - campo: 3d
            texto: soldar vértices duplicados como paso al cociente por una relación de equivalencia
        lecturas:
          rigor: 'Halmos, *Naive Set Theory*; Velleman, *How to Prove It*; Enderton, *Elements of Set Theory*.'
          practica: 'Codd, «A Relational Model of Data for Large Shared Data Banks» (1970), el origen de las bases de datos relacionales.'
          espanol: 'Krick, *Álgebra I*.'
      - id: I.3
        titulo: Naturales, enteros y divisibilidad
        paginas: 40
        requiere:
          - I.2
        tipo: nucleo
        contenidos:
          - Axiomas de Peano, inducción y definición por recursión; principio del buen orden.
          - Los enteros, construidos a partir de ℕ; algoritmo de la división y divisibilidad.
          - Máximo común divisor, algoritmo de Euclides y su versión extendida; identidad de Bézout.
          - 'Números primos, infinitud de los primos y teorema fundamental de la aritmética; problemas abiertos que se enuncian con estas palabras: Goldbach, los primos gemelos y la conjetura de Collatz.'
        puente: 'Entrada: `while (b != 0) { t = b; b = a % b; a = t; }`. Es el algoritmo de Euclides, y su terminación es el principio del buen orden.'
        aplicaciones:
          - campo: cripto
            texto: 'aritmética racional exacta: la forma canónica de Fraction y de GMP, y el tamaño de los denominadores'
          - campo: senales
            texto: 'el período de una suma de tonos: la quinta justa y la temperada'
          - campo: 3d
            texto: texturas superpuestas con tamaños coprimos («principio de la cigarra») y su período fundamental
        lecturas:
          rigor: 'Rosen, *Elementary Number Theory and Its Applications*; Stillwell, *Elements of Number Theory*.'
          practica: 'Knuth, *The Art of Computer Programming*, vol. 2, sobre el algoritmo de Euclides y su costo.'
          espanol: 'Gentile, *Notas de álgebra I*; Krick, *Álgebra I*.'
      - id: I.4
        titulo: Congruencias y aritmética modular
        paginas: 44
        requiere:
          - I.3
        tipo: nucleo
        contenidos:
          - Congruencias y el anillo ℤ/nℤ; inversos modulares; teorema chino del resto.
          - Pequeño teorema de Fermat, función φ de Euler y teorema de Euler.
          - 'Residuos cuadráticos, símbolo de Legendre y ley de reciprocidad cuadrática; raíces cuadradas módulo p.'
          - 'Primos para la criptografía: test de Fermat, números de Carmichael y test de Miller–Rabin. Exponenciación rápida y el problema del logaritmo discreto; la distribución de los primos llega en IX.15.'
        puente: 'Entrada: `state = state * 6364136223846793005 + 1442695040888963407`. Un generador congruencial lineal es una iteración en ℤ/2⁶⁴ℤ, y su período lo deciden condiciones de aritmética modular (teorema de Hull–Dobell).'
        aplicaciones:
          - campo: cripto
            texto: 'las claves de RSA (PKCS #1): el descifrado con el teorema chino del resto y el ataque por máximo común divisor'
          - campo: cripto
            texto: 'Diffie–Hellman en los grupos de TLS, y el bit del secreto que delata el criterio de Euler'
          - campo: 3d
            texto: '*hashing* espacial: constantes impares en tablas de 2ᵏ cubetas, y semillas enteras para mundos procedurales'
          - campo: datos
            texto: 'reparto de claves entre servidores: con el resto módulo N se muda la fracción N/(N + 1), y la dispersión consistente'
        lecturas:
          rigor: 'Hoffstein, Pipher y Silverman, *An Introduction to Mathematical Cryptography*; Rosen, *Elementary Number Theory and Its Applications*.'
          practica: "Knuth, *The Art of Computer Programming*, vol. 2; Menezes, van Oorschot y Vanstone, *Handbook of Applied Cryptography* (libre); O'Neill, «PCG» (2014), sobre los generadores congruenciales."
          espanol: 'Krick, *Álgebra I*.'
      - id: I.5
        titulo: Combinatoria
        paginas: 44
        requiere:
          - I.3
        tipo: nucleo
        contenidos:
          - Principios de la suma y del producto; permutaciones y combinaciones.
          - Coeficientes binomiales, teorema del binomio y triángulo de Pascal.
          - Principio de inclusión–exclusión y principio del palomar; el número de Ramsey R(3, 3) = 6.
          - Recurrencias lineales y funciones generatrices.
        puente: 'Entrada: el triángulo de Pascal dentro de un código de curvas de Bézier. Los coeficientes de los polinomios de Bernstein son binomiales, y la recurrencia de Pascal es la que hace funcionar el algoritmo de De Casteljau (aviso de III.9 y VII.6).'
        aplicaciones:
          - campo: datos
            texto: 'la prueba exacta de Fisher: el valor p como cociente de coeficientes binomiales'
          - campo: cripto
            texto: 'colisiones de *hash* y paradoja del cumpleaños: umbrales de 32 a 256 bits, los UUID y las abreviaturas de Git'
          - campo: 3d
            texto: subdivisión de las curvas de Bézier con De Casteljau y descarte de intersecciones con la caja de los puntos de control
          - campo: fisica
            texto: 'conteo de microestados y entropía de Boltzmann: la concentración alrededor de N/2 y las temperaturas negativas'
        lecturas:
          rigor: 'Graham, Knuth y Patashnik, *Concrete Mathematics*; Stanley, *Enumerative Combinatorics*, vol. 1.'
          practica: 'Farin, *Curves and Surfaces for CAGD*, sobre el algoritmo de De Casteljau.'
          primer_contacto: 'Bóna, *A Walk Through Combinatorics*.'
  - letra: B
    titulo: Estructuras discretas y algebraicas
    capitulos:
      - id: I.6
        titulo: Grafos
        paginas: 44
        requiere:
          - I.2
          - I.5
        tipo: nucleo
        contenidos:
          - Grafos, grados, caminos, ciclos y conectividad; árboles y sus caracterizaciones.
          - Recorridos en anchura y en profundidad; árboles generadores mínimos.
          - "Caminos mínimos: Dijkstra y A\\*, con la demostración de optimalidad para heurísticas admisibles."
          - Grafos planos y fórmula de Euler V − E + F = 2; coloración y teorema de los cuatro colores (enunciado), demostrado con una computadora.
        puente: 'Entrada: `node.children.forEach(update)` en un grafo de escena. La escena es un árbol y la actualización es un recorrido en profundidad; la fórmula de Euler es la primera comprobación de que una malla cerrada está bien formada.'
        aplicaciones:
          - campo: ing
            texto: la red eléctrica de Borůvka, el primer árbol generador mínimo
          - campo: datos
            texto: agrupamiento por enlace simple con el árbol generador mínimo
          - campo: 3d
            texto: caminos con A* en mallas de navegación
          - campo: 3d
            texto: validación de mallas con la fórmula de Euler
        lecturas:
          rigor: 'Bondy y Murty, *Graph Theory*; West, *Introduction to Graph Theory*; Diestel, *Graph Theory*.'
          practica: 'Cormen, Leiserson, Rivest y Stein, *Introduction to Algorithms*; Hart, Nilsson y Raphael, «A Formal Basis for the Heuristic Determination of Minimum Cost Paths» (1968), el artículo de A*; Akenine-Möller y otros, *Real-Time Rendering*, para los grafos de escena.'
          historia: 'Biggs, Lloyd y Wilson, *Graph Theory 1736–1936*.'
      - id: I.7
        titulo: Grupos
        paginas: 50
        requiere:
          - I.4
        tipo: nucleo
        contenidos:
          - Grupos, subgrupos y teorema de Lagrange; grupos cíclicos.
          - 'La cota del test de Miller–Rabin: los testigos falsos caben en un subgrupo propio, por el teorema de Lagrange.'
          - Homomorfismos, subgrupos normales y grupos cociente.
          - Grupos de permutaciones y signo de una permutación.
          - Productos directos; el teorema chino del resto como isomorfismo.
          - Acciones de grupo, órbitas y estabilizadores; conjugación y clases de conjugación; lema de Burnside.
        puente: 'Entrada: `2 <= y <= p - 2 and pow(y, q, p) == 1`, la validación de una clave pública de Diffie–Hellman. Por el orden de un elemento y el teorema de Lagrange, una clave que pasa tiene orden q, y no deja al atacante el subgrupo pequeño que le permitiría averiguar el secreto por partes.'
        aplicaciones:
          - campo: fisica
            texto: 'las vibraciones de la molécula de agua: el grupo C₂ᵥ, su tabla de caracteres y qué vibraciones absorben infrarrojo; los cristales, como aviso'
          - campo: cripto
            texto: 'calcular un logaritmo discreto por partes: el algoritmo de Pohlig y Hellman y por qué el grupo tiene orden primo'
          - campo: 3d
            texto: 'un caleidoscopio con el grupo diédrico: órbitas, dominio fundamental y costuras; los embaldosados, como aviso'
          - campo: datos
            texto: 'guardar cada posición del ta-te-ti una sola vez: forma canónica frente al lema de Burnside'
        lecturas:
          rigor: 'Dummit y Foote, *Abstract Algebra*; Artin, *Algebra*.'
          practica: 'RFC 2631, sección 2.1.5, y NIST SP 800-56A, sobre la validación de claves públicas; Conway, Burgiel y Goodman-Strauss, *The Symmetries of Things*.'
          primer_contacto: 'Pinter, *A Book of Abstract Algebra*; Carter, *Visual Group Theory*.'
          historia: 'Kleiner, *A History of Abstract Algebra*; Slocum y Sonneveld, *The 15 Puzzle*.'
          espanol: 'Dorronsoro y Hernández, *Números, grupos y anillos*.'
      - id: I.8
        titulo: Anillos, cuerpos y polinomios
        paginas: 48
        requiere:
          - I.7
        tipo: nucleo
        contenidos:
          - Anillos, ideales y anillos cociente; dominios de integridad y dominios euclídeos.
          - 'Anillos de polinomios: división, raíces, factorización y polinomios irreducibles.'
          - Cuerpos y extensiones simples; ℚ construido como cuerpo de fracciones de ℤ; ℝ, ℂ y ℤ/pℤ como cuerpos.
          - 'Cuerpos finitos GF(pⁿ): existencia, construcción y aritmética. La teoría de Galois llega en V.6, y las bases de Gröbner, en V.9.'
        puente: 'Entrada: `x = (x << 1) ^ ((x & 0x80) ? 0x1B : 0)`. Es multiplicar por x en GF(2⁸) módulo un polinomio irreducible: la operación con la que se construyen AES y los códigos de los QR.'
        aplicaciones:
          - campo: senales
            texto: detección de errores con el CRC-32 de PNG, gzip y Ethernet
          - campo: cripto
            texto: recuperación de datos con códigos de Reed–Solomon (HDFS, RAID 6) y reparto de secretos de Shamir, por interpolación
          - campo: 3d
            texto: 'evaluación de polinomios en un *shader*: Horner, Estrin y la FMA con números de máquina'
          - campo: cripto
            texto: 'la mezcla de columnas de AES: polinomios sobre GF(2⁸) módulo x⁴ + 1, un anillo que no es cuerpo'
        lecturas:
          rigor: 'Dummit y Foote, *Abstract Algebra*; Lidl y Niederreiter, *Introduction to Finite Fields and Their Applications*.'
          practica: 'NIST, FIPS 197, la norma de AES, de donde sale `xtime`; Daemen y Rijmen, *The Design of Rijndael*.'
          primer_contacto: 'Gallian, *Contemporary Abstract Algebra*.'
          espanol: 'Gentile, *Anillos de polinomios*; Krick, *Álgebra I*.'
  - letra: C
    titulo: Los números reales y la máquina
    capitulos:
      - id: I.9
        titulo: Números reales y complejos
        paginas: 40
        requiere:
          - I.8
        tipo: nucleo
        contenidos:
          - 'Cuerpos ordenados; por qué ℚ no basta: √2 y los huecos de ℚ.'
          - Construcción de ℝ por cortaduras de Dedekind; axioma del supremo; unicidad del cuerpo ordenado completo.
          - ℝ no es numerable, con la diagonal de Cantor de I.2 aplicada a los desarrollos binarios.
          - 'ℂ como ℝ[x]/(x² + 1): conjugado, módulo y desigualdad triangular.'
          - Forma polar y multiplicación como rotación y escala, con la trigonometría de la secundaria (III.8 la fundamenta).
          - 'Teorema fundamental del álgebra: enunciado y factorización en ℂ[x] y en ℝ[x]; se demuestra en III.8.'
        puente: 'Entrada: `z = z * complex(cos(a), sin(a))` en un juego 2D. Multiplicar por un número complejo de módulo 1 es rotar: es la versión plana de lo que harán los cuaterniones (aviso de II.16).'
        aplicaciones:
          - campo: 3d
            texto: 'interpolar orientaciones en el plano: SLERP y NLERP'
          - campo: ing
            texto: 'fasores, impedancias y resonancia en el sintonizador de una radio de AM'
          - campo: senales
            texto: 'reconocer los tonos de un teclado telefónico (DTMF) con las raíces de la unidad'
          - campo: fisica
            texto: 'amplitudes complejas en el experimento de las dos rendijas'
        lecturas:
          rigor: 'Spivak, *Calculus* (construcción de ℝ); Needham, *Visual Complex Analysis*.'
          practica: 'Kuipers, *Quaternions and Rotation Sequences*, para las rotaciones como productos.'
          espanol: 'Gentile, *Notas de álgebra: números complejos*.'
      - id: I.10
        titulo: Números en la máquina
        paginas: 40
        requiere:
          - I.4
          - I.9
        tipo: nucleo
        contenidos:
          - Representación posicional y cambio de base; enteros de máquina y complemento a dos como aritmética módulo 2ⁿ.
          - 'Coma flotante IEEE 754: mantisa, exponente, valores especiales, épsilon de máquina y ULP.'
          - Redondeo y error relativo; cancelación catastrófica; condicionamiento frente a estabilidad.
          - Formatos reducidos (float16, bfloat16, punto fijo y enteros normalizados) y error de cuantización.
        puente: 'Entrada: `0.1 + 0.2 == 0.3` da falso, y `if (abs(a - b) < 1e-6)`. Ninguno de esos números es representable exactamente, y la comparación correcta depende de la magnitud (tolerancia relativa), no de un épsilon fijo.'
        aplicaciones:
          - campo: 3d
            texto: el temblor lejos del origen, el cambio de origen y el dibujo relativo a la cámara; posiciones y normales comprimidas con *KHR_mesh_quantization*
          - campo: datos
            texto: el *softmax* estable y su análisis de errores; productos escalares en bfloat16 acumulados en precisión simple
          - campo: ing
            texto: 'contadores que dan la vuelta: el Boeing 787, *time_after* de Linux, el Ariane 5 y el Patriot'
          - campo: cripto
            texto: 'determinismo entre plataformas: la FMA, el *lockstep* de los juegos y la aritmética entera de Ethereum'
        lecturas:
          rigor: 'Goldberg, «What Every Computer Scientist Should Know About Floating-Point Arithmetic»; Overton, *Numerical Computing with IEEE Floating Point Arithmetic*; Higham, *Accuracy and Stability of Numerical Algorithms*.'
          practica: "La norma IEEE 754-2019; Dawson, «Comparing Floating Point Numbers», sobre la comparación por ULP; Warren, *Hacker's Delight*."
  - letra: D
    titulo: Conjuntos, orden y computación
    capitulos:
      - id: I.11
        titulo: 'Teoría axiomática de conjuntos: ZFC, elección y ordinales'
        paginas: 40
        requiere:
          - I.3
          - I.9
        tipo: nucleo
        contenidos:
          - La paradoja de Russell y los axiomas de Zermelo–Fraenkel; los naturales como ordinales de von Neumann.
          - 'Axioma de elección y sus equivalentes: lema de Zorn y principio del buen orden; existencia de bases en todo espacio vectorial.'
          - Ordinales, inducción transfinita y recursión transfinita.
          - 'Cardinales: teorema de Cantor–Schröder–Bernstein, aritmética cardinal e hipótesis del continuo (su independencia, enunciada).'
        puente: 'Entrada: `def ack : Nat → Nat → Nat` en Lean, que el asistente solo acepta si se demuestra que termina. La función de Ackermann termina porque el par (m, n) decrece en el orden lexicográfico, un buen orden de tipo ω²: toda demostración de terminación es una inducción sobre un buen orden.'
        aplicaciones:
          - campo: cripto
            texto: 'terminación de programas con órdenes bien fundados: la unificación de la inferencia de tipos, con una terna que baja en el orden lexicográfico, y la comprobación de aparición'
          - campo: fisica
            texto: 'la paradoja de Banach–Tarski: por qué la masa no puede definirse en todos los subconjuntos, qué pone el axioma de elección y por qué una bola de átomos no se duplica'
          - campo: 3d
            texto: 'jerarquías de escena sin ciclos: la regla recursiva de glTF, que termina por la buena fundación, y los archivos y bibliotecas que no la garantizan'
        lecturas:
          rigor: 'Halmos, *Naive Set Theory*; Hrbacek y Jech, *Introduction to Set Theory*; Jech, *Set Theory*, para la consistencia relativa.'
          practica: 'Avigad, de Moura, Kong y Ullrich, *Theorem Proving in Lean 4*, sobre la recursión bien fundada y la terminación.'
          historia: 'Ferreirós, *Labyrinth of Thought*.'
      - id: I.12
        titulo: Órdenes, retículos y álgebras de Boole
        paginas: 40
        requiere:
          - I.2
          - I.6
          - I.11
        tipo: nucleo
        contenidos:
          - Conjuntos parcialmente ordenados, cadenas y anticadenas; elementos maximales, supremos e ínfimos; diagramas de Hasse.
          - Retículos, retículos completos y distributivos; teorema del punto fijo de Knaster–Tarski.
          - 'Álgebras de Boole: el álgebra de partes y el álgebra de las proposiciones; formas normales disyuntiva y conjuntiva; minimización de circuitos.'
          - Filtros e ideales; teorema de representación de Stone, para las álgebras finitas y, con el lema de Zorn, en general.
        puente: 'Entrada: el bucle de un analizador de flujo de datos, que repite «la entrada de cada nodo es la unión de las salidas de sus predecesores» hasta que nada cambia. Los conjuntos de hechos forman un retículo y cada vuelta aplica una función monótona: el teorema de Knaster–Tarski garantiza que existe el menor punto fijo, y la altura finita del retículo, que el bucle llega a él.'
        aplicaciones:
          - campo: cripto
            texto: 'análisis estático: la propagación de constantes como menor punto fijo en un retículo de altura finita'
          - campo: cripto
            texto: 'cajas de sustitución sin tablas: formas normales y operaciones bit a bit contra los ataques por tiempo'
          - campo: datos
            texto: 'tipos de datos replicados sin conflictos (CRDT): la mezcla de réplicas como supremo de un semirretículo'
          - campo: 3d
            texto: 'geometría constructiva de sólidos: el árbol de OpenSCAD reescrito como unión de intersecciones'
        lecturas:
          rigor: 'Davey y Priestley, *Introduction to Lattices and Order*; Givant y Halmos, *Introduction to Boolean Algebras*.'
          practica: 'Nielson, Nielson y Hankin, *Principles of Program Analysis*; Aho, Lam, Sethi y Ullman, *Compilers*, sobre el análisis de flujo de datos.'
      - id: I.13
        titulo: Autómatas finitos y lenguajes regulares
        paginas: 36
        requiere:
          - I.2
          - I.6
        tipo: complementario
        contenidos:
          - Alfabetos, palabras y lenguajes; autómatas finitos deterministas y no deterministas; construcción de subconjuntos.
          - 'Expresiones regulares y teorema de Kleene: describen exactamente los lenguajes que reconocen los autómatas.'
          - Teorema de Myhill–Nerode y minimización de autómatas.
          - 'Lema del bombeo: lenguajes que no son regulares, como el de los paréntesis balanceados. Para seguir: gramáticas libres de contexto y análisis sintáctico.'
        puente: 'Entrada: `re.compile(r"[0-9]+(\.[0-9]*)?")` en el analizador léxico de un lenguaje de programación. Una expresión regular se compila en un autómata finito, y el teorema de Kleene dice que eso siempre es posible; el lema del bombeo explica por qué ninguna expresión regular reconoce los paréntesis balanceados.'
        aplicaciones:
          - campo: cripto
            texto: analizadores léxicos de compiladores y validación de entradas
          - campo: 3d
            texto: máquinas de estados de animación y de comportamiento en videojuegos
          - campo: bio-eco
            texto: búsqueda de sitios de restricción y de motivos en secuencias de ADN
          - campo: ing
            texto: verificación de protocolos de comunicación
        lecturas:
          rigor: 'Sipser, *Introduction to the Theory of Computation*; Hopcroft, Motwani y Ullman, *Introduction to Automata Theory, Languages, and Computation*.'
          practica: 'Thompson, «Regular Expression Search Algorithm» (1968); Cox, «Regular Expression Matching Can Be Simple And Fast» (2007); la documentación del módulo `re` de Python.'
      - id: I.14
        titulo: Lógica de primer orden y computabilidad
        paginas: 48
        requiere:
          - I.1
          - I.3
          - I.13
        tipo: complementario
        contenidos:
          - Lenguajes de primer orden, estructuras y satisfacción; consecuencia lógica y deducción formal.
          - Teorema de completitud de Gödel y teorema de compacidad; modelos no estándar.
          - Funciones recursivas, máquinas de Turing y tesis de Church–Turing; indecidibilidad del problema de la parada, teorema de Rice y décimo problema de Hilbert (enunciado).
          - 'Teoremas de incompletitud de Gödel: idea de la demostración.'
          - 'Las clases P y NP y el problema abierto de si son distintas; por qué la criptografía supone que lo son. Para seguir: teoría de la complejidad computacional.'
        puente: 'Entrada: `solver.check()` devuelve `unknown` en un resolvedor SMT. Sobre la aritmética entera con multiplicación la satisfacibilidad es indecidible (décimo problema de Hilbert), así que ningún resolvedor puede responder siempre: el `unknown` es un teorema, no un defecto.'
        aplicaciones:
          - campo: cripto
            texto: 'análisis estático de programas: una variable sin valor, las falsas alarmas y los límites que impone el teorema de Rice'
          - campo: datos
            texto: 'SQL como lógica de primer orden: el NOT EXISTS doble, las consultas independientes del dominio y la alcanzabilidad que pide WITH RECURSIVE'
          - campo: cripto
            texto: 'resolución de dependencias de un gestor de paquetes como satisfacibilidad, un problema NP-completo, y la selección de versión mínima de Go, que lo evita'
          - campo: ing
            texto: 'verificación de políticas de acceso en la nube con resolvedores SMT (Zelkova, en AWS): unsat como garantía, y los autómatas que deciden los patrones'
        lecturas:
          rigor: "Enderton, *A Mathematical Introduction to Logic*; Sipser, *Introduction to the Theory of Computation*; Franzén, *Gödel's Theorem: An Incomplete Guide to Its Use and Abuse*."
          practica: 'De Moura y Bjørner, «Z3: An Efficient SMT Solver» (2008).'
          historia: 'Davis, *The Universal Computer*.'
      - id: I.15
        titulo: Demostraciones como programas
        paginas: 40
        requiere:
          - I.1
          - I.11
          - I.14
        tipo: complementario
        contenidos:
          - 'Deducción natural para la lógica proposicional y de primer orden; la lógica intuicionista: qué se pierde sin el tercero excluido y sin la doble negación, y qué se gana.'
          - 'Cálculo λ simplemente tipado y correspondencia de Curry–Howard: las proposiciones son tipos y las demostraciones son programas; la conjunción es el par, la implicación es la función y la disyunción es la suma, y simplificar una demostración es ejecutar un programa.'
          - 'Tipos dependientes: el cuantificador universal como función y el existencial como par; la igualdad como tipo y la inducción como recursión. La teoría de tipos como fundamento, frente a la teoría de conjuntos de I.11.'
          - 'Asistentes de demostración: el núcleo que verifica, las tácticas que construyen términos y qué garantiza que una computadora acepte una demostración, con el teorema de los cuatro colores como ejemplo. Para seguir: teoría homotópica de tipos y bibliotecas de matemática formalizada.'
        puente: 'Entrada: `theorem intercambio (p q : Prop) : p ∧ q → q ∧ p := fun ⟨hp, hq⟩ => ⟨hq, hp⟩` en Lean. La demostración es un programa: la función que recibe un par y lo devuelve invertido, la misma que en Python es `lambda par: (par[1], par[0])`. Que Lean la acepte quiere decir que el tipo de ese programa es el enunciado.'
        aplicaciones:
          - campo: cripto
            texto: código criptográfico verificado, generado junto con su demostración de corrección y usado en navegadores
          - campo: ing
            texto: compiladores y núcleos de sistemas operativos verificados para sistemas críticos
          - campo: fisica
            texto: las dimensiones físicas como tipos, que impiden sumar metros con segundos, y la formalización de la física en asistentes de demostración
        lecturas:
          rigor: 'Sørensen y Urzyczyn, *Lectures on the Curry–Howard Isomorphism*; Girard, Lafont y Taylor, *Proofs and Types*.'
          practica: 'Avigad, de Moura, Kong y Ullrich, *Theorem Proving in Lean 4*; Avigad y Massot, *Mathematics in Lean*.'
          primer_contacto: 'Wadler, «Propositions as Types» (2015).'
